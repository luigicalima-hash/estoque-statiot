<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statiot - Gestão de Estoque</title>
    <!-- Importação da fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca Html5-Qrcode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

    <!-- Elementos de fundo Glow -->
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

<div class="container">
    <!-- Cabeçalho com Logo à esquerda e Statitot centralizado -->
    <header class="app-header">
        <div class="logo-container">
            <label for="logo-input" class="logo-upload-box" title="Clique para adicionar a logo da empresa">
                <input type="file" id="logo-input" accept="image/*" style="display: none;" onchange="carregarLogo(event)">
                <span id="logo-placeholder"><i class="fa-solid fa-image"></i> Logo</span>
                <img id="logo-preview" src="" alt="Logo" style="display: none;">
            </label>
        </div>
        <div class="header-titles">
            <h1>Statiot</h1>
            <h2>Controle de Estoque</h2>
            <p>Gestão relacional em nuvem integrada com FastAPI e SQLite</p>
        </div>
    </header>
    
    <!-- Formulários de Ação -->
    <div class="forms-grid">
       <!-- Cadastrar Item -->
        <div class="glass-panel">
            <h3><i class="fa-solid fa-box-archive"></i> Novo Item</h3>
            <form id="form-item">
                <label>Código:</label>
                <input type="text" id="item-codigo" placeholder="Ex: M8x40" required>
                
                <label>Nome do Item:</label>
                <input type="text" id="item-nome" placeholder="Ex: Parafuso M8x40" required>
                
                <label>Estoque Mínimo:</label>
                <input type="number" id="item-minimo" placeholder="Ex: 100" required>

                <label>Localização / Setor:</label>
                <input type="text" id="item-local" placeholder="Ex: Prateleira C ou Setor TI" required>

                <label>Responsável (Opcional):</label>
                <input type="text" id="item-resp" placeholder="Ex: Carlos Silva ou Deixar em Branco">
                
                <button type="submit"><i class="fa-solid fa-plus"></i> Cadastrar Item</button>
            </form>
        </div>

        <!-- Registrar Movimentação -->
        <div class="glass-panel">
            <h3><i class="fa-solid fa-right-left"></i> Lançar Movimentação</h3>
            <form id="form-mov">
                <label>Código do Item:</label>
                <input type="text" id="mov-codigo" placeholder="Ex: M8x30" required>
                
                <label>Tipo de Movimentação:</label>
                <div class="tipo-toggle-group">
                    <input type="radio" id="tipo-entrada" name="mov-tipo" value="Entrada" checked>
                    <label for="tipo-entrada" class="toggle-btn entrada-btn"><i class="fa-solid fa-arrow-down"></i> Entrada</label>

                    <input type="radio" id="tipo-saida" name="mov-tipo" value="Saída">
                    <label for="tipo-saida" class="toggle-btn saida-btn"><i class="fa-solid fa-arrow-up"></i> Saída</label>
                </div>
                
               <label>Quantidade:</label>
               <input type="number" id="mov-qtd" placeholder="Ex: 50" min="1" required>
                
                <button type="submit"><i class="fa-solid fa-paper-plane"></i> Registrar Lançamento</button>
            </form>
        </div>
    </div>

    <!-- Tabela de Estoque e Barra de Ferramentas Elegante -->
    <div class="table-wrapper">
        <div class="table-header search-toolbar">
            <div class="table-header-top">
                <h3><i class="fa-solid fa-chart-line"></i> Saldo Atual em Tempo Real</h3>
            </div>
            
            <!-- Barra de Ferramentas (Busca + Escaner perfeitamente nivelados) -->
            <div class="search-action-group">
                <div class="search-bar-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="input-busca" placeholder="Pesquisar por código ou descrição do item..." onkeyup="filtrarEstoque()">
                </div>
                <button type="button" onclick="toggleLeitorModal()" class="btn-scanner-refined" title="Escanear Etiqueta">
                    <i class="fa-solid fa-qrcode"></i>
                    <span>Escanear QR</span>
                </button>
            </div>

            <!-- Modal / Coletor Flutuante Estilizado -->
            <div id="modal-leitor" class="scanner-modal" style="display: none;">
                <div class="scanner-modal-header">
                    <span><i class="fa-solid fa-camera-viewfinder"></i> Leitor de Ativos</span>
                    <button type="button" onclick="pararLeitor()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="reader" class="scanner-viewport"></div>
                <div id="resultado-leitura" class="scanner-result"></div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Item</th>
                        <th>Localização</th>
                        <th>Saldo Atual</th>
                        <th>Estoque Mínimo</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer>
    <p>Statiot Inventory Systems &copy; 2026 — Todos os direitos reservados.</p>
</footer>

<script>
    const API_URL = 'https://estoque-statiot.onrender.com';
    let html5QrCode = null;
    let listaEstoqueGlobal = [];

    // Função para pré-visualizar a logo da empresa
    function carregarLogo(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('logo-preview');
            const placeholder = document.getElementById('logo-placeholder');
            output.src = reader.result;
            output.style.display = 'block';
            placeholder.style.display = 'none';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    // 1. Carregar dados do estoque e salvar na global
    async function carregarEstoque() {
        try {
            const resposta = await fetch(`${API_URL}/api/estoque`);
            listaEstoqueGlobal = await resposta.json();
            renderizarTabela(listaEstoqueGlobal);
        } catch (erro) {
            console.error('Erro ao carregar dados:', erro);
        }
    }

    // Renderiza a tabela considerando a Localização
    function renderizarTabela(dados) {
        const tbody = document.getElementById('tabela-corpo');
        tbody.innerHTML = '';

        if (dados.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 20px;">Nenhum item encontrado.</td></tr>`;
            return;
        }

        dados.forEach(item => {
            const classeStatus = item.Status === 'Repor' ? 'status-repor' : 'status-ok';
            const iconeStatus = item.Status === 'Repor' ? '<i class="fa-solid fa-triangle-exclamation"></i> Repor' : '<i class="fa-solid fa-check"></i> OK';
            
            const linha = `
                <tr>
                    <td><strong>${item.Codigo}</strong></td>
                    <td>${item.Item}</td>
                    <td><span style="color: var(--text-muted); font-size: 0.85rem;"><i class="fa-solid fa-location-dot"></i> ${item.Localizacao || 'Geral'}</span></td>
                    <td>${item.Saldo}</td>
                    <td>${item.EstoqueMinimo}</td>
                    <td><span class="status-badge ${classeStatus}">${iconeStatus}</span></td>
                    <td>
                        <a href="${API_URL}/api/etiqueta/${item.Codigo}" target="_blank" class="btn-etiqueta" title="Baixar Etiqueta em PDF com QR Code">
                            <i class="fa-solid fa-qrcode"></i> Etiqueta
                        </a>
                    </td>
                </tr>
            `;
            tbody.innerHTML += linha;
        });
    }

    // Filtro instantâneo de pesquisa
    function filtrarEstoque() {
        const termo = document.getElementById('input-busca').value.toLowerCase();
        const filtrados = listaEstoqueGlobal.filter(item => 
            item.Codigo.toLowerCase().includes(termo) || item.Item.toLowerCase().includes(termo)
        );
        renderizarTabela(filtrados);
    }

    // 2. Evento para Cadastrar Novo Item (Com Localização e Responsável)
    document.getElementById('form-item').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            codigo: document.getElementById('item-codigo').value,
            nome: document.getElementById('item-nome').value,
            estoque_minimo: parseInt(document.getElementById('item-minimo').value),
            localizacao: document.getElementById('item-local').value,
            responsavel: document.getElementById('item-resp').value || null
        };

        const res = await fetch(`${API_URL}/api/itens`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert('Item cadastrado com sucesso!');
            document.getElementById('form-item').reset();
            carregarEstoque();
        } else {
            const err = await res.json();
            alert('Erro: ' + (err.detail || 'Não foi possível cadastrar.'));
        }
    });

    // 3. Evento para Registrar Movimentação
    document.getElementById('form-mov').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const qtdInput = parseInt(document.getElementById('mov-qtd').value);
        if (isNaN(qtdInput) || qtdInput <= 0) {
            alert('Por favor, insira uma quantidade válida maior que zero.');
            return;
        }

        const tipoSelecionado = document.querySelector('input[name="mov-tipo"]:checked').value;
        const payload = {
            codigo_item: document.getElementById('mov-codigo').value,
            tipo: tipoSelecionado,
            quantidade: qtdInput
        };

        const res = await fetch(`${API_URL}/api/movimentacoes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert('Movimentação registrada com sucesso!');
            document.getElementById('form-mov').reset();
            carregarEstoque();
        } else {
            const err = await res.json();
            alert('Erro: ' + (err.detail || 'Não foi possível registrar.'));
        }
    });

    // Controle do Modal do Leitor de QR Code
    function toggleLeitorModal() {
        const modal = document.getElementById('modal-leitor');
        if (modal.style.display === 'none' || modal.style.display === '') {
            modal.style.display = 'block';
            iniciarLeitor();
        } else {
            pararLeitor();
        }
    }

    function iniciarLeitor() {
        if (html5QrCode && html5QrCode.isScanning) return;

        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 200, height: 200 } };
        
        html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
                let codigoAtivo = decodedText;
                if (decodedText.includes('/ativo/')) {
                    const partes = decodedText.split('/ativo/');
                    codigoAtivo = partes[1];
                }

                document.getElementById('resultado-leitura').innerHTML = `
                    <span style="color: #10b981;"><i class="fa-solid fa-circle-check"></i> Lido: <strong>${codigoAtivo}</strong></span>
                `;

                const inputBusca = document.getElementById('input-busca');
                inputBusca.value = codigoAtivo;
                filtrarEstoque();

                pararLeitor();
            },
            (errorMessage) => {}
        ).catch((err) => {
            alert("Erro ao acessar a câmera. Verifique as permissões.");
            pararLeitor();
        });
    }

    function pararLeitor() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(err => console.error(err));
        }
        const modal = document.getElementById('modal-leitor');
        if (modal) modal.style.display = 'none';
    }

    // Inicialização ao carregar a página
    carregarEstoque();
</script>

</body>
</html>
