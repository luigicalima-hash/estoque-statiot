<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statiot - Gestão de Ativos (Admin)</title>
  
  <style>
    /* Estilo Oficina Contemporânea */
    :root {
      --bg-body: #f8f7f5;
      --bg-box: #ffffff;
      --texto-escuro: #111111;
      --texto-cinza: #6b7280;
      --ferrugem: #c2410c; 
      --borda: #e5e7eb;
    }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--texto-escuro);
      margin: 0;
      padding: 3rem 4rem;
    }

    .header-top {
      display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5rem;
    }

    .indicator {
      display: flex; align-items: center; gap: 0.75rem; font-size: 0.75rem;
      font-weight: 700; color: var(--texto-cinza); text-transform: uppercase; letter-spacing: 1px;
    }
    .indicator .line { width: 24px; height: 2px; background-color: var(--ferrugem); }
    h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; margin: 0.5rem 0 0 0; }

    /* Botões Padrão Index */
    .btn {
      padding: 0.7rem 1.2rem; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      border-radius: 2px; text-decoration: none; display: inline-flex; align-items: center;
      justify-content: center; transition: all 0.2s ease; border: 1px solid transparent;
    }
    .btn-outline { background: #fff; color: var(--texto-escuro); border: 1px solid #ccc; }
    .btn-outline:hover { background: #f3f4f6; border-color: var(--texto-escuro); }
    .btn-solid { background: var(--texto-escuro); color: #fff; }
    .btn-solid:hover { background: #333; }
    .btn-nf { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; padding: 0.4rem 0.8rem; font-size: 0.75rem; }
    .btn-nf:hover { background: #fde68a; }

    /* Tabela */
    .table-container { background: var(--bg-box); border: 1px solid var(--borda); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 1.2rem 1rem; font-size: 0.75rem; color: var(--texto-cinza); text-transform: uppercase; border-bottom: 1px solid var(--borda); letter-spacing: 1px; }
    td { padding: 1.2rem 1rem; font-size: 0.9rem; font-weight: 600; border-bottom: 1px solid var(--borda); }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(17, 17, 17, 0.7); backdrop-filter: blur(3px);
      display: none; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #fff; width: 850px; max-width: 95%; border-radius: 4px; 
      padding: 2.5rem; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--ferrugem); padding-bottom: 1rem; margin-bottom: 2rem;
    }
    .modal-header h2 { margin: 0; font-size: 1.5rem; }
    .btn-fechar { background: transparent; border: none; font-size: 1.8rem; cursor: pointer; color: var(--texto-cinza); }
    .btn-fechar:hover { color: var(--ferrugem); }

    /* Formulário */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-group.full { grid-column: span 2; }
    label { font-size: 0.75rem; font-weight: 700; color: var(--texto-cinza); text-transform: uppercase; }
    input { 
      padding: 0.8rem; border: 1px solid var(--borda); border-radius: 2px;
      font-family: inherit; font-size: 0.95rem; background: var(--bg-body); transition: border 0.2s;
    }
    input:focus { outline: none; border-color: var(--ferrugem); background: #fff; }

    .upload-box {
      border: 2px dashed #d1d5db; padding: 2rem; text-align: center; background: var(--bg-body);
      display: flex; flex-direction: column; gap: 1rem; align-items: center; border-radius: 4px;
    }
    hr { border: 0; border-top: 1px solid var(--borda); margin: 2.5rem 0; }

    /* Badge Valores */
    .valor-total { font-size: 1.1rem; color: #047857; font-weight: 800; }
  </style>
</head>
<body>

  <header class="header-top">
    <div>
      <div class="indicator"><span class="line"></span> BACKOFFICE STATIOT</div>
      <h1>Gestão Financeira & Ativos</h1>
    </div>
    <div>
      <a href="index.html" class="btn btn-outline">Voltar ao Inventário</a>
    </div>
  </header>

  <div class="table-container">
    <table id="tabela-admin">
      <thead>
        <tr>
          <th>Código</th>
          <th>Item / Responsável</th>
          <th>Saldo Físico</th>
          <th>Valor Unitário</th>
          <th>Total Imobilizado</th>
          <th>Anexos</th>
          <th>Gestão</th>
        </tr>
      </thead>
      <tbody>
        <!-- Preenchido via JS -->
      </tbody>
    </table>
  </div>

  <!-- MODAL DE EDIÇÃO -->
  <div class="modal-overlay" id="modal-edicao">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Ficha Completa: <span id="modal-codigo-titulo" style="color: var(--ferrugem);"></span></h2>
        <button class="btn-fechar" onclick="fecharModal()">&times;</button>
      </div>

      <form id="form-admin" class="form-grid">
        <input type="hidden" id="edit-codigo">
        
        <div class="form-group full">
          <label>Descrição do Item *</label>
          <input type="text" id="edit-nome" required>
        </div>

        <div class="form-group">
          <label>Estoque Mínimo *</label>
          <input type="number" id="edit-minimo" min="1" required>
        </div>

        <!-- ADICIONE ESTE BLOCO NOVO AQUI -->
        <div class="form-group">
          <label style="color: var(--ferrugem);">Saldo Físico (Ajuste)</label>
          <input type="number" id="edit-saldo" min="0" required>
        </div>
        <!-- FIM DO BLOCO NOVO -->

        <div class="form-group">
          <label>Localização</label>
          <input type="text" id="edit-local">
        </div>

        <div class="form-group">
          <label>Responsável Pelo Ativo</label>
          <input type="text" id="edit-resp" placeholder="Ex: TI, Manutenção...">
        </div>

        <div class="form-group">
          <label>Fornecedor</label>
          <input type="text" id="edit-fornecedor">
        </div>

        <div class="form-group">
          <label>Valor Unitário (R$)</label>
          <input type="number" id="edit-valor" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="form-group">
          <label>Data de Compra</label>
          <input type="date" id="edit-data-compra">
        </div>

        <div class="form-group full">
          <button type="submit" class="btn btn-solid" style="width: 100%; padding: 1rem; font-size: 1rem;">Salvar Informações Gerenciais</button>
        </div>
      </form>

      <hr>

      <div class="upload-box">
        <h3 style="margin: 0; font-size: 1.1rem; color: var(--texto-escuro);">Nota Fiscal ou Garantia</h3>
        <p style="margin: 0; font-size: 0.85rem; color: var(--texto-cinza);">Anexe o PDF ou Imagem do comprovante de compra.</p>
        <input type="file" id="nf-arquivo" accept=".pdf, image/*" style="background: #fff; padding: 0.5rem;">
        <button type="button" class="btn btn-outline" style="border-color: var(--ferrugem); color: var(--ferrugem);" onclick="enviarNotaFiscal()">Subir Arquivo para o Servidor</button>
      </div>

    </div>
  </div>

  <script>
    // Segurança
    const role = (localStorage.getItem('statiot_user_role') || '').trim().toLowerCase();
    if (role !== 'admin') {
      alert("Acesso Negado: Apenas administradores acessam a gestão avançada.");
      window.location.href = "index.html";
    }

    const API_URL = "https://estoque-statiot.onrender.com"; // ATUALIZE PARA O SEU RENDER

    // Formata Moeda
    const formataReal = (valor) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);

    // Carregar Lista
    async function carregarLista() {
      try {
        const res = await fetch(`${API_URL}/api/estoque`);
        const itens = await res.json();
        const tbody = document.querySelector("#tabela-admin tbody");
        tbody.innerHTML = "";

        itens.forEach(item => {
          const valorUnitario = parseFloat(item.valor_unitario) || 0;
          const saldo = parseInt(item.Saldo) || 0;
          const valorTotal = valorUnitario * saldo;

          // Botão de Nota Fiscal Dinâmico
          const btnNF = item.caminho_nf 
            ? `<a href="${API_URL}/${item.caminho_nf.replace('\\', '/')}" target="_blank" class="btn btn-nf">📄 Ver NF</a>`
            : `<span style="font-size: 0.75rem; color: #9ca3af;">Sem anexo</span>`;

          // Garantindo que os dados não venham como 'null' na string
          const safeData = (data) => data && data !== 'null' ? data : '';

          // Cria a linha injetando os dados exatos pro Modal puxar depois
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="color: var(--ferrugem);">${item.Codigo}</td>
            <td>
              <strong>${item.Item}</strong><br>
              <small style="color: var(--texto-cinza)">${safeData(item.Responsavel) || 'Sem responsável'}</small>
            </td>
            <td>${saldo} un</td>
            <td>${formataReal(valorUnitario)}</td>
            <td class="valor-total">${formataReal(valorTotal)}</td>
            <td>${btnNF}</td>
            <td>
              <td>
              <button class="btn btn-outline" onclick="abrirModal(
                '${item.Codigo}', '${item.Item}', '${item.EstoqueMinimo}', 
                '${safeData(item.Localizacao)}', '${safeData(item.Responsavel)}', 
                '${valorUnitario}', '${safeData(item.fornecedor)}', '${safeData(item.data_compra)}',
                '${saldo}' // <-- Parâmetro novo aqui
              )">Editar</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        console.error("Erro ao carregar lista:", e);
      }
    }

    // Modal com Recuperação Total de Dados
    // Adicione a variável saldoAtual no final
    function abrirModal(codigo, nome, minimo, local, resp, valor, forn, dataCompra, saldoAtual) {
      document.getElementById('modal-codigo-titulo').innerText = codigo;
      document.getElementById('edit-codigo').value = codigo;
      document.getElementById('edit-nome').value = nome;
      document.getElementById('edit-minimo').value = minimo;
      document.getElementById('edit-saldo').value = saldoAtual; // <-- Preenche o input
      document.getElementById('edit-local').value = local;
      document.getElementById('edit-resp').value = resp;
      document.getElementById('edit-valor').value = valor !== "0" ? valor : "";
      document.getElementById('edit-fornecedor').value = forn;
      document.getElementById('edit-data-compra').value = dataCompra;
      document.getElementById('nf-arquivo').value = ''; 

      document.getElementById('modal-edicao').style.display = 'flex';
    }

    function fecharModal() { document.getElementById('modal-edicao').style.display = 'none'; }

    // Salvar Dados
    document.getElementById('form-admin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const codigo = document.getElementById('edit-codigo').value;
      
      let valorInput = parseFloat(document.getElementById('edit-valor').value);
      if (valorInput < 0) { alert("O valor não pode ser negativo."); return; } // Dupla checagem no front

      const payload = {
        nome: document.getElementById('edit-nome').value,
        estoque_minimo: parseInt(document.getElementById('edit-minimo').value),
        localizacao: document.getElementById('edit-local').value || "Geral",
        saldo_atual: parseInt(document.getElementById('edit-saldo').value),
        responsavel: document.getElementById('edit-resp').value || null,
        valor_unitario: valorInput || 0.0,
        fornecedor: document.getElementById('edit-fornecedor').value || null,
        data_compra: document.getElementById('edit-data-compra').value || null
      };

      try {
        const btn = e.target.querySelector('button');
        btn.textContent = "Salvando...";
        
        const res = await fetch(`${API_URL}/api/admin/itens/${codigo}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if(res.ok) {
          fecharModal();
          carregarLista(); // Recarrega a tabela em tempo real
        } else { alert("Erro ao atualizar o item."); }
      } catch (erro) { alert("Falha de conexão."); } 
      finally { e.target.querySelector('button').textContent = "Salvar Informações Gerenciais"; }
    });

    // Upload NF
    async function enviarNotaFiscal() {
      const codigo = document.getElementById('edit-codigo').value;
      const arquivoInput = document.getElementById('nf-arquivo');
      
      if (!arquivoInput.files[0]) { alert("Selecione um arquivo primeiro."); return; }

      const formData = new FormData();
      formData.append("arquivo", arquivoInput.files[0]);

      try {
        const res = await fetch(`${API_URL}/api/admin/itens/${codigo}/upload-nf`, {
          method: "POST", body: formData
        });

        if(res.ok) {
          alert("Arquivo salvo com sucesso!");
          arquivoInput.value = ''; 
          carregarLista(); // Atualiza a tela pra aparecer o botão "Ver NF"
        } else { alert("Erro ao processar o upload."); }
      } catch (e) { alert("Erro de conexão."); }
    }

    carregarLista();
  </script>
</body>
</html>
